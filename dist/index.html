<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto 1</title>
    <link rel="shortcut icon" href="/dist/public/img/favicon/fabi2.jpeg" type="image/x-icon">
</head>
<body>
    <div class="container mt-4" id="contenedor">
        <div class="row justify-content-center">
            <div class="col text-center">
                <h1 class="text-danger display-3"><i class="fa-solid fa-dragon"></i>Dragon Ball GAME <i class="fa-solid fa-dragon"></i></h1>
            </div>
            
        </div>
        <div id ="nombres" class="row justify-content-around mt-4">
                <div class="col-md-5">
                    <div class="form-floating border border-danger rounded mb-3">
                        <input type="text" id="player1" class="form-control" placeholder="Jugador 1">
                        <label for="player1" class="text-danger"><i class="fa-solid fa-user">  </i>Jugador 1</label>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="form-floating border border-primary rounded mb-3">
                        <input type="text" id="player2" class="form-control" placeholder="Jugador 2">
                        <label for="player2" class="text-primary">Jugador 2</label>
                    </div>
                    
                </div>
        </div>
        <div class="row justify-content-around mt-3">
            <div id="py1" class="col-md-5 text-center">
                <span class="text-danger">Seleccionar personaje</span>
                <div class="row mt-4">
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/img/seleccion/05.png" alt="Goku">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/img/seleccion/01.png" alt="Veguito">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/img/seleccion/03.png" alt="Trunks">
                    </div>  
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-danger border-danger" src="./public/img/seleccion/06.png" alt="Gohan">
                    </div>
                </div>
                
                <button id="btn_player1" type="button" class="btn btn-danger w-100 mt-4"> Aceptar <i class="fa-solid fa-gamepad"></i></button>
            </div>

            <div id="py2" class="col-md-5 text-center">
                <span>Seleccionar personaje</span>
                <div class="row mt-4">
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/img/seleccion/02.png" alt="Veguetta">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/img/seleccion/04.png" alt="Pikoro">
                    </div>
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/img/seleccion/07.png" alt="Gogueta">
                    </div>   
                    <div class="col-3">
                        <img class="img-fluid rounded-circle bg-primary border-primary" src="./public/img/seleccion/08.png" alt="Cell">
                    </div>
                </div>
                <button id="btn_player2" type="button" class="btn btn-primary w-100 mt-4"> Aceptar <i class="fa-solid fa-gamepad"></i></button>
            </div>

        </div>
        <div class="row justify-content-around mt-4 d-none" id="batalla1">

            <div class="col-md-5 text-center">
                <h2 id="username1" class="text-danger"></h2>
                <p id="personaje1" class="lead fs-4"></p>

                <div class="text-start">

                    <label for="vida1" class="text-success">Vida</label>
                    <div class="progress" role="progressbar" aria-label="Vida" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div id="vida1"  class="progress-bar bg-success" style="width: 100%">100%</div>
                    </div>

                    <label for="ki1" class="text-primary">KI</label>
                    <div  class="progress" role="progressbar" aria-label="KI" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div id="ki1" class="progress-bar bg-primary" style="width: 100%">100%</div>
                    </div>

                    <label for="energia1" class="text-info">Energia</label>
                    <div  class="progress" role="progressbar" aria-label="Energia" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div id="energia1" class="progress-bar bg-info" style="width: 100%">100%</div>
                    </div>

                </div>

                <hr>

                <img id="img1" src="" class="mx-auto d-block" width="50%" alt="">

                <div class="row">
                    <div id="btn_py1" class="col">
                        <button class="btn btn-warning me-2 mb-3">ATK Basico</button>
                        <button class="btn btn-danger me-2 mb-3">ATK Especial</button>
                        <button class="btn btn-info me-2 mb-3">Cargar Ki</button>
                        <button class="btn btn-success me-2 mb-3" id = "btn_semilla1">Semilla <span class="badge text-bg-dark">2</span></button>
                    </div>
                </div>
            </div>

            <div class="col-md-5 text-center d-none" id="batalla2">
                <h2 id="username2" class="text-primary"></h2>
                <p id="personaje2" class="lead fs-4"></p>

                <div class="text-start">

                    <label for="vida2" class="text-success">Vida</label>
                    <div  class="progress" role="progressbar" aria-label="Vida" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div id="vida2" class="progress-bar bg-success" style="width: 100%">100%</div>
                    </div>

                    <label for="ki2" class="text-primary">KI</label>
                    <div class="progress" role="progressbar" aria-label="KI" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div id="ki2" class="progress-bar bg-primary" style="width: 100%">100%</div>
                    </div>

                    <label for="energia2" class="text-info">Energia</label>
                    <div class="progress" role="progressbar" aria-label="Energia" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
                        <div id="energia2" class="progress-bar bg-info" style="width: 100%">100%</div>
                    </div>

                </div>

                <hr>

                <img id="img2" src="" class="mx-auto d-block" width="50%" alt="">

                <div class="row">
                    <div id="btn_py2" class="col">
                        <button class="btn btn-warning me-2 mb-3">ATK Basico</button>
                        <button class="btn btn-danger me-2 mb-3">ATK Especial</button>
                        <button class="btn btn-info me-2 mb-3">Cargar Ki</button>
                        <button class="btn btn-success me-2 mb-3" id="btn_semilla2">Semilla <span class="badge text-bg-dark">2</span></button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="./bundle.js"></script>
</body>
</html>
